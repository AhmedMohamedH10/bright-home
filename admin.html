<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>لوحة تحكم برايت هوم</title>
<style>
@font-face{font-family:Cairo;src:url(assets/fonts/cairo-arabic.woff) format("woff");unicode-range:U+0600-06FF,U+200C-200F}
@font-face{font-family:Cairo;src:url(assets/fonts/cairo-latin.woff) format("woff");unicode-range:U+0000-00FF}
:root{--b:#0f62b8;--bd:#0b3f78;--bg:#f2f5fa;--t:#14233a;--m:#6b7a90;--l:#dde5f0;--ok:#12a150;--er:#d93a3a}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.6 Cairo,Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:10px 22px;background:linear-gradient(90deg,var(--bd),var(--b));color:#fff;box-shadow:0 2px 14px #0b3f7855}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}.brand img{height:34px;background:#fff;border-radius:9px;padding:3px}
.top nav{display:flex;gap:6px;margin-inline-start:18px}.top nav button{background:#ffffff1c;border:0;color:#fff;padding:7px 18px;border-radius:99px;cursor:pointer;font-weight:700}.top nav .on{background:#fff;color:var(--bd)}
#pub{margin-inline-start:auto}
.btn{border:1px solid var(--l);background:#fff;border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:700;transition:.15s}.btn:hover{border-color:var(--b);color:var(--b)}
.pri{background:#fff;color:var(--bd);border:0}.pri:hover{color:var(--b);transform:translateY(-1px)}
.sol{background:var(--b);color:#fff;border-color:var(--b)}.sol:hover{background:var(--bd);color:#fff}.dg:hover{border-color:var(--er);color:var(--er)}
#bd{display:inline-block;background:var(--er);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;margin-inline-start:6px;font-style:normal}
#ban{margin:14px 22px 0}.bn{background:#fff7e0;border:1px solid #f1d58a;border-radius:12px;padding:10px 16px;display:flex;gap:10px;align-items:center}
main{padding:18px 22px}.g3{display:grid;grid-template-columns:270px 1fr 290px;gap:16px;align-items:start}.g2{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
.card{background:#fff;border:1px solid var(--l);border-radius:16px;box-shadow:0 2px 10px #14233a0a}.card>.sh{padding:12px;border-bottom:1px solid var(--l);display:flex;gap:8px}
.sh input{flex:1;min-width:0}

input[type=color]{padding:2px;height:38px;cursor:pointer}input[type=checkbox]{width:auto}
.list{max-height:calc(100vh - 190px);overflow:auto;padding:8px}
.pi,.gi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;cursor:pointer;border:1px solid transparent}.pi:hover,.gi:hover{background:#f2f6fc}.pi.on,.gi.on{background:#e8f1fd;border-color:#b9d3f3}
.pi img{width:38px;height:48px;object-fit:contain;background:#eef3fa;border-radius:8px}.pi div{flex:1;min-width:0}.pi b,.pi small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}small{color:var(--m)}
.pi span{display:flex;flex-direction:column}.pi span button{border:0;background:none;cursor:pointer;color:var(--m);line-height:1;padding:2px}.pi span button:hover{color:var(--b)}
.gi{justify-content:space-between}.gi em{font-style:normal;min-width:26px;text-align:center;border-radius:99px;background:#e8f1fd;color:var(--b);font-weight:800;font-size:13px}.gi em.z{background:#f0f2f6;color:#9aa6b8}
#ed,#gd{padding:20px}h2{margin:0 0 14px;font-size:19px}h4{margin:20px 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}

.drop{border:2px dashed #b9c9de;border-radius:14px;padding:14px;text-align:center;cursor:pointer;background:#fafcff;color:var(--m);display:flex;gap:14px;align-items:center;justify-content:center}.drop:hover,.drop.ov{border-color:var(--b);background:#eef5ff}
.drop img{height:90px;object-fit:contain}
.vr{border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:12px;background:#fcfdff}.vr .vh{display:flex;justify-content:space-between;margin-bottom:10px;font-weight:800;color:var(--b)}
.vi{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:13px;color:var(--m)}.vi img{height:46px}
#pv{position:sticky;top:76px;padding:16px;text-align:center}.cv{--h:#6cf08a;position:relative;height:300px;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 62%,color-mix(in srgb,var(--h) 55%,#fff0),#0f2a4d 72%)}
.cv .bx{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:105%}.cv .pr{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);height:86%;filter:drop-shadow(0 10px 14px #0007)}
.cv .tag{position:absolute;top:10px;right:10px;background:#ffffffdd;color:var(--bd);border-radius:99px;padding:1px 11px;font-size:12px;font-weight:800;z-index:2}
.ci{padding:12px 4px 4px}.ci small{color:var(--b);font-weight:700}.ci h3{margin:2px 0}.ci p{margin:0;color:var(--m);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}.chips button{border:1px solid var(--l);background:#fff;border-radius:99px;padding:2px 11px;cursor:pointer;font-size:12px}.chips .on{background:var(--b);color:#fff;border-color:var(--b)}
.st{display:flex;gap:10px;margin-bottom:16px}.st div{flex:1;background:#f2f7fe;border-radius:12px;padding:8px 14px}.st b{font-size:20px;color:var(--b);display:block;line-height:1.2}.st span{font-size:12px;color:var(--m)}

.hd{font-size:12px;color:var(--m);font-weight:700}.emp{text-align:center;color:var(--m);padding:26px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#14233a;color:#fff;padding:10px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20}#toast.on{opacity:1}
dialog{border:0;border-radius:18px;padding:24px;max-width:480px;box-shadow:0 20px 60px #0006}dialog::backdrop{background:#0b1e3a88}dialog ol{padding-inline-start:20px;line-height:1.9}
@media(max-width:1000px){.g3,.g2{grid-template-columns:1fr}#pv{position:static}.list{max-height:260px}.f,.f.c3{grid-template-columns:1fr}.dr{grid-template-columns:1fr 1fr}.dr button{grid-column:1/-1}}
#lg{position:fixed;inset:0;z-index:30;background:linear-gradient(135deg,var(--bd),var(--b));display:grid;place-items:center}#lg form{background:#fff;border-radius:20px;padding:28px;width:min(360px,92vw);display:grid;gap:12px}#lg h2{margin:0}
.chip{background:#ffffff26;border-radius:99px;padding:3px 14px;font-size:13px;font-weight:700}.top .gh{background:#ffffff1c;color:#fff;border:0}
.ur{display:grid;grid-template-columns:1.1fr 1.6fr auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--l);border-radius:12px;margin-bottom:8px}.ur label{display:inline-flex;gap:4px;font-weight:400;margin:0 6px 0 0}
</style></head><body>
<header class="top"><div class="brand"><img src="assets/img/logo-s.webp" alt="">لوحة تحكم برايت هوم</div>
<nav><button data-tab="p" id="tp" class="on">📦 المنتجات</button><button data-tab="d" id="td">📍 الموزعين</button><button data-tab="u" id="tu" hidden>👥 المستخدمين</button></nav>
<span id="me" class="chip" hidden></span><button id="pub" class="btn pri">🚀 نشر على الموقع<i id="bd" hidden>●</i></button><button id="zp" class="btn gh" title="تحميل نسخة ZIP">⬇ ZIP</button><button id="lo" class="btn gh" hidden>خروج</button></header>
<div id="ban"></div><main id="app"></main><div id="toast"></div>
<div id="lg" hidden><form id="lf"><h2>🔐 دخول لوحة التحكم</h2><input id="lu" placeholder="اسم المستخدم" autocomplete="username" dir="ltr"><input id="lpw" type="password" placeholder="كلمة السر" autocomplete="current-password" dir="ltr"><button class="btn sol">دخول</button><small id="le" style="color:var(--er)"></small></form></div>
<input type="file" id="file" accept="image/png,image/webp,image/jpeg" hidden>
<dialog id="dlg"><h2>✅ اتحمّل ملف التحديثات</h2><ol><li>فُك ضغط الملف <b>bright-home-update.zip</b>.</li><li>ارفع محتوياته فوق ملفات الموقع (GitHub) بنفس أسماء المجلدات: <code dir="ltr">js/</code> و <code dir="ltr">assets/</code>.</li><li>استنى دقيقة وافتح الموقع واعمل تحديث للصفحة.</li></ol><button class="btn sol" onclick="dlg.close()">تمام</button></dialog>
<script src="js/config.js"></script><script src="js/egypt-map.js"></script><script src="js/products-data.js"></script><script src="js/distributors-data.js"></script>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const API=(typeof CONFIG!=='undefined'&&CONFIG.ADMIN_API)||'';let tok=sessionStorage.getItem('bh_tok')||'',me=null;
const CATS={degrease:'مزيل الدهون',soap:'غسول اليدين',fresh:'معطر ملابس'},GOVS=EGYPT_MAP.govs,KEY='bh_admin_draft';
let P=JSON.parse(JSON.stringify(PRODUCTS)),D=JSON.parse(JSON.stringify(DISTRIBUTORS)),imgs={},sel=0,pj=0,gov=GOVS[0].id,tab='p',pick=null,dirty=false,q='',gq='',tm;
const U=o=>o?(imgs[o.src]?imgs[o.src].url:o.src):'',pn=p=>p.variants[0]?.label||'منتج جديد';
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)};
const mark=()=>{dirty=true;$('#bd').hidden=false;clearTimeout(tm);if(!API)tm=setTimeout(()=>localStorage.setItem(KEY,JSON.stringify({P,D})),400)};
const nv=()=>({sku:'',label:'',cat:'',hue:'#6cf08a',pack:1,unit:'جركن'});
/* ===== تحويل صورة PNG لـ WebP (نسخة عادية + نسخة موبايل) ===== */
async function conv(f){const bm=await createImageBitmap(f),s=Math.min(1,900/bm.height),w=Math.round(bm.width*s),h=Math.round(bm.height*s),mw=Math.round(w*.711),mh=Math.round(h*.711);
 const mk=(W,H)=>{const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(bm,0,0,W,H);return new Promise(r=>c.toBlob(r,'image/webp',.86))};
 const src='assets/products/n'+Date.now().toString(36)+'.webp',full=await mk(w,h);imgs[src]={full,m:await mk(mw,mh),url:URL.createObjectURL(full)};return{src,w,h,mw}}
async function setImg(f,j){if(!f||!/^image\//.test(f.type))return toast('اختار ملف صورة (PNG أو WebP)');toast('جاري تجهيز الصورة…');const o=await conv(f);j<0?P[sel].img=o:P[sel].variants[j].img=o;mark();renderP();toast('تم رفع الصورة ✓')}
/* ===== المنتجات ===== */
function renderP(){const p=P[sel];
 $('#app').innerHTML=`<div class="g3"><aside class="card"><div class="sh"><input id="q" placeholder="🔍 بحث في المنتجات" value="${E(q)}"><button class="btn sol" data-a="addP">+ جديد</button></div><div class="list" id="pl"></div></aside>
 <section class="card" id="ed">${p?edP(p):'<div class="emp">اختار منتج من القايمة أو أضف منتج جديد</div>'}</section><aside class="card" id="pv"></aside></div>`;listP();pvw()}
function listP(){$('#pl').innerHTML=P.map((p,i)=>({p,i})).filter(({p})=>!q||(pn(p)+p.tag+p.variants.map(v=>v.label+v.sku).join()).includes(q)).map(({p,i})=>`<div class="pi ${i==sel?'on':''}" data-a="selP" data-i="${i}"><img src="${U(p.img)}" alt=""><div><b>${E(pn(p))}</b><small>${E(CATS[p.cat])} · ${E(p.tag)} · ${p.variants.length} صنف</small></div><span><button data-a="up" data-i="${i}" title="فوق">▲</button><button data-a="dn" data-i="${i}" title="تحت">▼</button></span></div>`).join('')||'<div class="emp">مفيش نتائج</div>'}
function edP(p){return`<h2>تعديل المنتج</h2><div class="f">
 <div><label>الفئة (للفلتر في الموقع)</label><select data-f="cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${p.cat==k?'selected':''}>${v}</option>`).join('')}</select></div>
 <div><label>الحجم على الكارت <small>(مثال: 5 لتر)</small></label><input data-f="tag" value="${E(p.tag)}"></div>
 <div class="s2"><label>وصف قصير تحت الاسم</label><input data-f="desc" value="${E(p.desc)}"></div>
 <div><label>لون التوهج ورا المنتج</label><input type="color" data-f="hue" value="${E(p.hue)}"></div>
 <div><label>&nbsp;</label><label style="font-weight:400"><input type="checkbox" data-f="cls" ${p.cls?'checked':''}> زجاجة رفيعة (شكل نحيف)</label></div>
 <div class="s2"><label>صورة المنتج الرئيسية <small>(PNG بخلفية شفافة — صورة الكراتين ثابتة ورا المنتج تلقائيًا)</small></label>${drop(p.img,-1)}</div></div>
 <h4>الأصناف (اللون / الريحة)<button class="btn sol" data-a="addV">+ صنف</button></h4>
 ${p.variants.map((v,j)=>`<div class="vr"><div class="vh"><span>صنف ${j+1}</span>${p.variants.length>1?`<button class="btn dg" data-a="rmV" data-j="${j}">حذف</button>`:''}</div><div class="f">
 <div><label>الاسم المعروض</label><input data-v="label" data-j="${j}" value="${E(v.label)}"></div>
 <div><label>الاسم الكامل في الطلب <small>(لازم يكون مميز)</small></label><input data-v="sku" data-j="${j}" value="${E(v.sku)}"></div>
 <div class="s2"><label>السطر الصغير فوق الاسم</label><input data-v="cat" data-j="${j}" value="${E(v.cat)}"></div></div>
 <div class="f c3" style="margin-top:12px"><div><label>محتوى الكرتونة <small>(العدد)</small></label><input type="number" min="1" data-v="pack" data-j="${j}" value="${v.pack}"></div><div><label>الوحدة</label><input data-v="unit" data-j="${j}" value="${E(v.unit)}" list="un"></div><div><label>اللون</label><input type="color" data-v="hue" data-j="${j}" value="${E(v.hue)}"></div></div>
 <div class="vi">${v.img?`<img src="${U(v.img)}" alt=""><span>صورة خاصة بالصنف</span><button class="btn dg" data-a="rmI" data-j="${j}">إزالة</button>`:`<button class="btn" data-a="img" data-j="${j}">🖼 صورة خاصة بالصنف (اختياري)</button>`}</div></div>`).join('')}
 <datalist id="un"><option>جركن<option>زجاجة<option>عبوة<option>قطعة</datalist>
 <div style="margin-top:18px"><button class="btn dg" data-a="delP">🗑 حذف المنتج</button></div>`}
const drop=(o,j)=>`<div class="drop" data-a="img" data-j="${j}">${o?`<img src="${U(o)}" alt=""><span>اضغط أو اسحب صورة جديدة لتغييرها</span>`:'<span>📤 اضغط هنا أو اسحب صورة PNG</span>'}</div>`;
function pvw(){const p=P[sel],b=$('#pv');if(!p){b.innerHTML='';return}const v=p.variants[pj]||p.variants[0]||nv(),im=v.img||p.img;
 b.innerHTML=`<small>معاينة الكارت</small><div class="cv" style="--h:${E(v.hue||p.hue)}"><span class="tag">${E(p.tag)||'—'}</span><img class="bx" src="assets/img/boxes.webp" alt="">${im?`<img class="pr" src="${U(im)}" alt="">`:''}</div>
 <div class="ci"><small>${E(v.cat)}</small><h3>${E(v.label)||'—'}</h3><p>${E(p.desc)}</p></div><div class="chips">${p.variants.map((x,j)=>`<button class="${j==pj?'on':''}" data-a="pj" data-j="${j}">${E(x.label)||'صنف '+(j+1)}</button>`).join('')}</div>`}
/* ===== الموزعين ===== */
const okPh=s=>/^(01\d{9}|201\d{9})$/.test(String(s).replace(/\D/g,''));
function renderD(){const all=GOVS.reduce((a,g)=>a+(D[g.id]||[]).length,0),cov=GOVS.filter(g=>(D[g.id]||[]).length).length;
 $('#app').innerHTML=`<div class="g2"><aside class="card"><div class="sh"><input id="gq" placeholder="🔍 محافظة أو اسم أو رقم" value="${E(gq)}"></div><div class="list" id="gl"></div></aside><section class="card" id="gd"><div class="st"><div><b>${all}</b><span>إجمالي الموزعين</span></div><div><b>${cov}/${GOVS.length}</b><span>محافظات مغطّاة</span></div></div><div id="gb"></div></section></div>`;listG();bodyG()}
function listG(){const f=gq.trim();$('#gl').innerHTML=GOVS.filter(g=>!f||g.name.includes(f)||(D[g.id]||[]).some(r=>(r.name+r.phone+(r.area||'')).includes(f))).map(g=>{const n=(D[g.id]||[]).length;return`<div class="gi ${g.id==gov?'on':''}" data-a="selG" data-g="${g.id}"><span>${E(g.name)}</span><em class="${n?'':'z'}">${n}</em></div>`}).join('')}
function bodyG(){const g=GOVS.find(x=>x.id==gov),r=D[gov]||(D[gov]=[]);
 $('#gb').innerHTML=`<h2>${E(g.name)} <small>(${r.length} موزع)</small></h2>${r.length?`<div class="dr hd"><span>الاسم</span><span>رقم الموبايل</span><span>المنطقة (اختياري)</span><span></span></div>`:'<div class="emp">مفيش موزعين هنا — المحافظة هتظهر «قريبًا» على الخريطة</div>'}
 ${r.map((x,i)=>`<div class="dr"><input data-d="name" data-i="${i}" value="${E(x.name)}" placeholder="اسم الموزع"><input data-d="phone" data-i="${i}" class="${okPh(x.phone)?'':'bad'}" value="${E(x.phone)}" placeholder="01012345678"><input data-d="area" data-i="${i}" value="${E(x.area||'')}" placeholder="المنطقة"><button data-a="rmD" data-i="${i}" title="حذف">🗑</button></div>`).join('')}
 <button class="btn sol" data-a="addD" style="margin-top:8px">+ إضافة موزع</button>`}
/* ===== التصدير (ZIP) ===== */
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})(),crc=u=>{let c=-1;for(let i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return(~c)>>>0};
function zip(fs){const en=new TextEncoder(),pt=[],cd=[];let o=0,cs=0;for(const f of fs){const nm=en.encode(f.name),c=crc(f.data),n=f.data.length,h=new DataView(new ArrayBuffer(30));
 h.setUint32(0,0x04034b50,1);h.setUint16(4,20,1);h.setUint16(6,0x800,1);h.setUint32(14,c,1);h.setUint32(18,n,1);h.setUint32(22,n,1);h.setUint16(26,nm.length,1);pt.push(h.buffer,nm,f.data);
 const d=new DataView(new ArrayBuffer(46));d.setUint32(0,0x02014b50,1);d.setUint16(4,20,1);d.setUint16(6,20,1);d.setUint16(8,0x800,1);d.setUint32(16,c,1);d.setUint32(20,n,1);d.setUint32(24,n,1);d.setUint16(28,nm.length,1);d.setUint32(42,o,1);cd.push(d.buffer,nm);o+=30+nm.length+n;cs+=46+nm.length}
 const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,1);e.setUint16(8,fs.length,1);e.setUint16(10,fs.length,1);e.setUint32(12,cs,1);e.setUint32(16,o,1);return new Blob([...pt,...cd,e.buffer],{type:'application/zip'})}
function check(){const er=[],sk=new Set();P.forEach((p,i)=>{const n='منتج '+(i+1)+' ('+pn(p)+')';if(!p.img)er.push(n+': ناقص صورة المنتج');if(!p.tag.trim())er.push(n+': ناقص الحجم على الكارت');p.variants.forEach((v,j)=>{if(!v.label.trim()||!v.sku.trim())er.push(n+' صنف '+(j+1)+': الاسم والاسم الكامل مطلوبين');else if(sk.has(v.sku))er.push(n+': الاسم الكامل مكرر «'+v.sku+'»');sk.add(v.sku)})});
 GOVS.forEach(g=>(D[g.id]||[]).forEach(r=>{if(!r.name.trim()||!okPh(r.phone))er.push(g.name+': موزع بيانات ناقصة أو رقم غلط ('+(r.name||'بدون اسم')+')')}));return er}
async function build(){const er=check();if(er.length)return alert('راجع الآتي قبل التحميل:\n\n• '+er.slice(0,12).join('\n• '));
 const en=new TextEncoder(),fs=[],used=new Set();
 P.forEach(p=>[p.img,...p.variants.map(v=>v.img)].forEach(o=>o&&imgs[o.src]&&!imgs[o.src].done&&used.add(o.src)));
 for(const s of used){fs.push({name:s,data:new Uint8Array(await imgs[s].full.arrayBuffer())},{name:s.replace('products/','products/m/'),data:new Uint8Array(await imgs[s].m.arrayBuffer())})}
 fs.push({name:'js/products-data.js',data:en.encode('/* بيانات المنتجات — بتتعدّل من لوحة التحكم (admin.html) */\nconst PRODUCTS = '+JSON.stringify(P,null,1)+';\n')});
 const ks=[...GOVS.map(g=>g.id),...Object.keys(D).filter(k=>!GOVS.some(g=>g.id==k))];
 fs.push({name:'js/distributors-data.js',data:en.encode('/* موزعي برايت هوم — بيتعدّل من لوحة التحكم (admin.html) */\nconst DISTRIBUTORS = {\n'+ks.map(k=>`\n  // ───── ${(GOVS.find(g=>g.id==k)||{}).name||k} ─────\n  ${k}: [\n`+(D[k]||[]).map(r=>`    { name:${JSON.stringify(r.name.trim())}, phone:${JSON.stringify(r.phone.trim())}${r.area&&r.area.trim()?`, area:${JSON.stringify(r.area.trim())}`:''} },\n`).join('')+'  ],\n').join('')+'};\n')});
 return fs}
async function exportZip(){const fs=await build();if(!fs)return;const a=document.createElement('a');a.href=URL.createObjectURL(zip(fs));a.download='bright-home-update.zip';a.click();dirty=false;$('#bd').hidden=true;dlg.showModal()}
const b64=d=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(new Blob([d]))});
async function publish(){if(!tok)return exportZip();let fs=await build();if(!fs)return;
 fs=fs.filter(f=>me.perms.includes(/distributors-data/.test(f.name)?'distributors':'products'));const b=$('#pub');b.disabled=true;toast('جاري النشر…');
 try{const files=[];for(const f of fs)files.push({path:f.name,b64:await b64(f.data)});await api('/publish','POST',{files});Object.values(imgs).forEach(i=>i.done=1);dirty=false;$('#bd').hidden=true;toast('تم النشر ✓ — الموقع هيتحدّث خلال دقيقة تقريبًا')}catch(e){alert(e.message)}b.disabled=false}
/* ===== الحساب والمستخدمين ===== */
const api=async(p,m='GET',b)=>{const r=await fetch(API+p,{method:m,headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:b?JSON.stringify(b):undefined}),j=await r.json().catch(()=>({}));if(r.status===401&&tok&&p!=='/login'){logout();throw new Error(j.error||'انتهت الجلسة')}if(!r.ok)throw new Error(j.error||'خطأ '+r.status);return j};
const logout=()=>{sessionStorage.removeItem('bh_tok');location.reload()},RL={developer:'مطوّر',owner:'مالك',editor:'محرّر'},PM={products:'المنتجات',distributors:'الموزعين'};
async function boot(){if(!API)return renderP();if(!tok){$('#lg').hidden=false;return}
 try{me=await api('/me');const d=await api('/data');if(d.products)P=new Function(d.products+';return PRODUCTS')();if(d.distributors)D=new Function(d.distributors+';return DISTRIBUTORS')();start()}catch(e){tok='';$('#lg').hidden=false}}
function start(){$('#lg').hidden=true;$('#me').hidden=$('#lo').hidden=false;$('#me').textContent=me.name+' · '+RL[me.role];
 const hp=!me.perms.includes('products'),hd=!me.perms.includes('distributors'),mg=me.role!='editor';$('#tp').hidden=hp;$('#td').hidden=hd;$('#tu').hidden=!mg;
 tab=!hp?'p':!hd?'d':mg?'u':'p';document.querySelectorAll('.top nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab==tab));R()}
async function renderU(){$('#app').innerHTML='<section class="card" id="gd"><h2>المستخدمين والصلاحيات</h2><div id="ul">جاري التحميل…</div></section>';let us=[];try{us=(await api('/users')).users}catch(e){return toast(e.message)}
 const rs=me.role=='developer'?['owner','editor']:['editor'];
 $('#ul').innerHTML=`<div class="vr"><div class="vh">إضافة مستخدم جديد</div><div class="f"><div><label>اسم المستخدم (إنجليزي)</label><input id="nu" dir="ltr"></div><div><label>الاسم</label><input id="nn"></div><div><label>كلمة السر (8 حروف+)</label><input id="np" dir="ltr"></div><div><label>الدور</label><select id="nr">${rs.map(r=>`<option value="${r}">${RL[r]}</option>`).join('')}</select></div><div class="s2"><label>الصلاحيات (للمحرّر)</label>${Object.keys(PM).map(k=>`<label style="display:inline-flex;gap:4px;font-weight:400"><input type="checkbox" class="pk" value="${k}"> ${PM[k]}</label>`).join(' ')}</div></div><button class="btn sol" data-a="addU" style="margin-top:12px">+ إضافة</button></div>`
 +(us.length?us.map(x=>`<div class="ur"><div><b>${E(x.name)}</b><br><small dir="ltr">${E(x.username)} · ${RL[x.role]}</small></div><div>${x.role=='owner'?'<small>كل الصلاحيات</small>':Object.keys(PM).map(k=>`<label><input type="checkbox" data-pu="${E(x.username)}" value="${k}" ${x.perms.includes(k)?'checked':''}> ${PM[k]}</label>`).join('')}</div><div><button class="btn" data-a="pwU" data-u="${E(x.username)}">🔑</button> <button class="btn dg" data-a="delU" data-u="${E(x.username)}">🗑</button></div></div>`).join(''):'<div class="emp">لسه مفيش مستخدمين</div>')}
async function addU(){const g=i=>$('#'+i).value.trim();try{await api('/users','POST',{username:g('nu'),name:g('nn'),password:g('np'),role:$('#nr').value,perms:[...document.querySelectorAll('.pk:checked')].map(c=>c.value)});toast('تمت الإضافة ✓');renderU()}catch(e){alert(e.message)}}
async function pwU(u){const p=prompt('كلمة السر الجديدة للمستخدم '+u+' (8 حروف على الأقل)');if(!p)return;try{await api('/users/'+u,'PATCH',{password:p});toast('اتغيرت كلمة السر ✓')}catch(e){alert(e.message)}}
async function delU(u){if(!confirm('تحذف المستخدم '+u+'؟'))return;try{await api('/users/'+u,'DELETE');renderU()}catch(e){alert(e.message)}}
async function permU(c){const u=c.dataset.pu;try{await api('/users/'+u,'PATCH',{perms:[...document.querySelectorAll(`[data-pu="${u}"]:checked`)].map(x=>x.value)});toast('اتحدّثت الصلاحيات ✓')}catch(e){alert(e.message);renderU()}}
/* ===== الأحداث ===== */
const R=()=>tab=='p'?renderP():tab=='d'?renderD():renderU();
document.addEventListener('click',e=>{const t=e.target.closest('[data-a],[data-tab]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i,j=+t.dataset.j,p=P[sel];
 if(t.dataset.tab){tab=t.dataset.tab;document.querySelectorAll('.top nav button').forEach(b=>b.classList.toggle('on',b==t));return R()}
 if(a=='selP'){sel=i;pj=0;renderP()}else if(a=='addP'){P.push({id:'p'+Date.now(),cat:'degrease',tag:'',desc:'',hue:'#6cf08a',cls:'',img:null,variants:[nv()]});sel=P.length-1;pj=0;mark();renderP()}
 else if(a=='up'||a=='dn'){e.stopPropagation();const k=a=='up'?i-1:i+1;if(P[k]){[P[i],P[k]]=[P[k],P[i]];sel=k;mark();renderP()}}
 else if(a=='delP'){if(confirm('تحذف المنتج «'+pn(p)+'» نهائيًا؟')){P.splice(sel,1);sel=Math.max(0,sel-1);pj=0;mark();renderP()}}
 else if(a=='addV'){p.variants.push(nv());pj=p.variants.length-1;mark();renderP()}else if(a=='rmV'){p.variants.splice(j,1);pj=0;mark();renderP()}
 else if(a=='img'){pick=j;$('#file').value='';$('#file').click()}else if(a=='rmI'){delete p.variants[j].img;mark();renderP()}else if(a=='pj'){pj=j;pvw()}
 else if(a=='selG'){gov=t.dataset.g;listG();bodyG()}else if(a=='addD'){(D[gov]=D[gov]||[]).push({name:'',phone:'',area:''});mark();bodyG();listG()}
 else if(a=='rmD'){if(confirm('تحذف الموزع ده؟')){D[gov].splice(i,1);mark();renderD()}}
 else if(a=='addU')addU();else if(a=='pwU')pwU(t.dataset.u);else if(a=='delU')delU(t.dataset.u)});
$('#file').onchange=e=>setImg(e.target.files[0],pick);
document.addEventListener('dragover',e=>{if(e.target.closest('.drop')){e.preventDefault();e.target.closest('.drop').classList.add('ov')}});
document.addEventListener('dragleave',e=>e.target.closest&&e.target.closest('.drop')?.classList.remove('ov'));
document.addEventListener('drop',e=>{const d=e.target.closest('.drop');if(d){e.preventDefault();setImg(e.dataTransfer.files[0],+d.dataset.j)}});
document.addEventListener('input',e=>{const t=e.target,p=P[sel];
 if(t.id=='q'){q=t.value;return listP()}if(t.id=='gq'){gq=t.value;return listG()}
 if(t.dataset.f){p[t.dataset.f]=t.type=='checkbox'?(t.checked?'slim':''):t.value;mark();listP();pvw()}
 else if(t.dataset.v){const v=p.variants[+t.dataset.j];v[t.dataset.v]=t.dataset.v=='pack'?Math.max(1,+t.value||1):t.value;mark();listP();pvw()}
 else if(t.dataset.d){const r=D[gov][+t.dataset.i];r[t.dataset.d]=t.value;if(t.dataset.d=='phone')t.classList.toggle('bad',!okPh(t.value));mark()}});
document.addEventListener('change',e=>{if(e.target.dataset.d)renderD();else if(e.target.dataset.pu)permU(e.target)});
$('#pub').onclick=publish;$('#zp').onclick=exportZip;$('#lo').onclick=logout;
$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';try{tok=(await api('/login','POST',{username:$('#lu').value.trim(),password:$('#lpw').value})).token;sessionStorage.setItem('bh_tok',tok);$('#lpw').value='';boot()}catch(x){tok='';$('#le').textContent=x.message}};addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
if(!API)try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.P){$('#ban').innerHTML='<div class="bn">📝 فيه مسودة محفوظة من آخر مرة. <button class="btn sol" id="rs">استرجاعها</button><button class="btn" id="ig">تجاهل</button></div>';
 $('#rs').onclick=()=>{P=d.P;D=d.D;sel=0;$('#ban').innerHTML='';toast('اتسترجعت المسودة (الصور الجديدة لازم ترفعها تاني)');R()};$('#ig').onclick=()=>{localStorage.removeItem(KEY);$('#ban').innerHTML=''}}}catch(_){}
boot();
</script></body></html>
