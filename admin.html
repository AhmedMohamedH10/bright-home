<style>

dialog{background:var(--pn);color:var(--t);border:1px solid var(--l);border-radius:14px;padding:24px;max-width:480px}dialog::backdrop{background:#020f24b3}dialog ol{padding-inline-start:20px;line-height:1.9}dialog code{background:var(--in);padding:1px 6px;border-radius:5px}

.chip{border:1px solid var(--l);color:var(--m);border-radius:99px;padding:2px 12px;font-size:13px;font-weight:600}.top .gh{color:var(--m)}

.f.c3{grid-template-columns:repeat(3,1fr)}.f.c4{grid-template-columns:repeat(4,1fr)}.vr .f+.f{margin-top:14px}.vr .vi{margin:0}.w100{width:100%}
label.ck{display:flex;align-items:center;gap:8px;font-weight:400;color:var(--t);height:38px;margin:0}
.lh{padding:2px 10px 8px;font-size:12px;color:var(--m)}

.pi span{opacity:0;transition:opacity .15s}.pi:hover span,.pi.on span{opacity:1}

.dr:not(.hd){padding:6px;border:1px solid var(--l);border-radius:10px;background:var(--in)}.dr:not(.hd) input{background:var(--pn)}.dr.hd{padding:0 6px}
.ur{background:var(--in)}.ur .chip{font-size:11px;padding:0 8px;margin-inline-start:6px}.ur>div:last-child{display:flex;gap:6px}
#gd h2 small{font:400 14px Cairo,sans-serif;color:var(--m)}

.sec{padding:24px 0 8px}.sec>h3{margin-bottom:16px;font-size:16px}

.drop.sq{flex-direction:column;height:200px;padding:10px;gap:8px;font-size:13px}.drop.sq img{height:140px;max-width:100%}

.vr{background:var(--in);padding:18px}.vr .vh{margin-bottom:14px}.vr input,.vr select{background:var(--pn)}.vr .f+.f{margin-top:16px}
.f.cb{grid-template-columns:1.5fr 1fr .8fr}select{padding-block:0;padding-inline:10px;line-height:1.2;text-align-last:right}select option{line-height:1.6}
#lg form{padding:32px 30px 28px;width:min(380px,92vw)}#lg h2{text-align:center;margin:0 0 10px}.lgo{display:block;width:170px;height:170px;object-fit:contain;margin:0 auto 6px}#lg small{text-align:center}

.pi .gp{width:14px;height:22px;flex:none;cursor:grab;touch-action:none;user-select:none;opacity:.55;background:radial-gradient(circle,var(--m) 1.3px,transparent 1.7px) 0 0/7px 7px}.pi .gp:hover{opacity:1}
.pi.drg{opacity:.45}.pi.ovt{box-shadow:inset 0 2px 0 var(--sky)}.pi.ovb{box-shadow:inset 0 -2px 0 var(--sky)}

.sw{position:relative;flex:none;width:46px;height:26px;border-radius:99px;border:1px solid var(--l);background:var(--pn);cursor:pointer;padding:0;transition:background .2s,border-color .2s}.sw i{position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:var(--m);transition:inset-inline-start .2s,background .2s}.sw.on{background:var(--bd);border-color:var(--bd)}.sw.on i{inset-inline-start:23px;background:#fff}
@media(max-width:1000px){.g3,.g2{grid-template-columns:1fr}#pv{position:static}.list{max-height:260px}.f,.f.c3,.f.c4,.f.cb{grid-template-columns:1fr}.imgrow{grid-template-columns:1fr}.dr{grid-template-columns:1fr 1fr}.dr button{grid-column:1/-1}.top{flex-wrap:wrap;padding:10px 16px}main{padding:16px}}
.pms{display:flex;flex-wrap:wrap;gap:10px}
.pm{display:inline-flex!important;align-items:center;gap:10px;margin:0!important;padding:10px 18px;min-height:46px;border:1px solid var(--l);border-radius:10px;background:var(--in);color:var(--t)!important;font-size:15px!important;font-weight:600!important;cursor:pointer;transition:border-color .15s,background .15s}
.pm:hover{border-color:var(--sky)}.pm:has(input:checked){border-color:var(--sky);background:#7fdcf517}
.pm input{width:22px;height:22px;margin:0;cursor:pointer}
.ur{grid-template-columns:1fr 1.8fr auto}
@media(max-width:1000px){.ur{grid-template-columns:1fr}}
.lt{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.lt input{max-width:260px}.lt .chips{margin:0;justify-content:flex-start;flex:1}
.ld{margin:22px 0 8px;font-weight:700;font-size:14px;color:var(--sky)}
.lr{display:grid;grid-template-columns:76px 86px 1fr;gap:12px;align-items:start;padding:10px 14px;border:1px solid var(--l);border-radius:10px;background:var(--in);margin-bottom:6px}.lr time{color:var(--m);font-size:13px;direction:ltr;text-align:right}
.lk{text-align:center;border-radius:99px;font-size:12px;font-weight:700;padding:1px 8px;border:1px solid var(--l);color:var(--m)}.k-add{color:#7fe3a1;border-color:#2c6b4a}.k-edit,.k-set{color:var(--sky);border-color:#1c5a80}.k-del,.k-sec{color:var(--er);border-color:#7a3b3b}.k-pub{color:#f2c879;border-color:#7a6130}
@media(max-width:700px){.lr{grid-template-columns:1fr;gap:4px}.lr time{text-align:start}.lk{justify-self:start}}
</style></head><body>
<header class="top"><div class="brand"><img src="assets/img/logo-s.webp" alt="">لوحة تحكم برايت هوم</div>
<nav><button data-tab="p" id="tp" class="on">المنتجات</button><button data-tab="d" id="td">الموزعين</button><button data-tab="u" id="tu" hidden>المستخدمين</button><button data-tab="l" id="tl" hidden>السجلات</button></nav>
<span id="me" class="chip" hidden></span><button id="pub" class="btn pri">نشر على الموقع<i id="bd" hidden>●</i></button><button id="zp" class="btn gh" title="تحميل نسخة ZIP">تحميل ZIP</button><button id="lo" class="btn gh" hidden>خروج</button></header>
<div id="ban"></div><main id="app"></main><div id="toast"></div>
<div id="lg" hidden><form id="lf"><img class="lgo" src="assets/img/logo-m.webp" alt="برايت هوم"><h2>دخول لوحة التحكم</h2><input id="lu" placeholder="اسم المستخدم" autocomplete="username" dir="ltr"><input id="lpw" type="password" placeholder="كلمة المرور" autocomplete="current-password" dir="ltr"><button class="btn sol">دخول</button><small id="le" style="color:var(--er)"></small></form></div>
<input type="file" id="file" accept="image/png,image/webp,image/jpeg" hidden>
<dialog id="dlg"><h2>تم تحميل ملف التحديثات</h2><ol><li>فكّ ضغط الملف <b>bright-home-update.zip</b>.</li><li>ارفع محتوياته إلى ملفات الموقع (GitHub) بالمجلدات نفسها: <code dir="ltr">js/</code> و <code dir="ltr">assets/</code>.</li><li>انتظر دقيقة ثم حدّث صفحة الموقع.</li></ol><button class="btn sol" onclick="dlg.close()">حسنًا</button></dialog>
<script src="js/config.js"></script><script src="js/egypt-map.js"></script><script src="js/products-data.js"></script><script src="js/distributors-data.js"></script><script src="js/settings-data.js"></script>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const API=(typeof CONFIG!=='undefined'&&CONFIG.ADMIN_API)||'';let tok=sessionStorage.getItem('bh_tok')||'',me=null;
const CATS={degrease:'مزيل الدهون',soap:'غسول اليدين',fresh:'معطر ملابس'},GOVS=EGYPT_MAP.govs,KEY='bh_admin_draft';
let S=typeof SETTINGS!=='undefined'&&SETTINGS?JSON.parse(JSON.stringify(SETTINGS)):{applyOpen:true},P=JSON.parse(JSON.stringify(PRODUCTS)),D=JSON.parse(JSON.stringify(DISTRIBUTORS)),imgs={},sel=0,pj=0,gov=GOVS[0].id,tab='p',pick=null,dirty=false,q='',gq='',tm;
const canS=()=>!API||(me&&me.perms.includes('settings')),U=o=>o?(imgs[o.src]?imgs[o.src].url:o.src):'',pn=p=>p.variants[0]?.label||'منتج جديد';
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)};
const mark=()=>{dirty=true;$('#bd').hidden=false;clearTimeout(tm);if(!API)tm=setTimeout(()=>localStorage.setItem(KEY,JSON.stringify({P,D})),400)};
const nv=()=>({sku:'',label:'',cat:'',hue:'#6cf08a',pack:1,unit:'جركن'});
/* ===== تحويل صورة PNG لـ WebP (نسخة عادية + نسخة موبايل) ===== */
async function conv(f){const bm=await createImageBitmap(f),s=Math.min(1,900/bm.height),w=Math.round(bm.width*s),h=Math.round(bm.height*s),mw=Math.round(w*.711),mh=Math.round(h*.711);
 const mk=(W,H)=>{const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(bm,0,0,W,H);return new Promise(r=>c.toBlob(r,'image/webp',.86))};
 const src='assets/products/n'+Date.now().toString(36)+'.webp',full=await mk(w,h);imgs[src]={full,m:await mk(mw,mh),url:URL.createObjectURL(full)};return{src,w,h,mw}}
async function setImg(f,j){if(!f||!/^image\//.test(f.type))return toast('اختر صورة PNG أو WebP');toast('جارٍ تجهيز الصورة…');const o=await conv(f);j<0?P[sel].img=o:P[sel].variants[j].img=o;mark();renderP();toast('تم رفع الصورة')}
/* ===== المنتجات ===== */
function renderP(){const p=P[sel];
 $('#app').innerHTML=`<div class="g3"><aside class="card"><div class="sh"><input id="q" placeholder="بحث في المنتجات" value="${E(q)}"><button class="btn sol" data-a="addP">+ جديد</button></div><div class="list" id="pl"></div></aside>
 <section class="card" id="ed">${p?edP(p):'<div class="emp">اختر منتجًا أو أضف منتجًا جديدًا</div>'}</section><aside class="card" id="pv"></aside></div>`;listP();pvw()}
function listP(){const rows=P.map((p,i)=>({p,i})).filter(({p})=>!q||(pn(p)+p.tag+p.variants.map(v=>v.label+v.sku).join()).includes(q));
 $('#pl').innerHTML=`<div class="lh">${rows.length} منتج</div>`+(rows.map(({p,i})=>`<div class="pi ${i==sel?'on':''}" data-a="selP" data-i="${i}"><img src="${U(p.img)}" alt=""><div><b>${E(pn(p))}</b><small>${E(CATS[p.cat])}${p.tag?'، '+E(p.tag):''}</small></div><em title="عدد الأصناف">${p.variants.length}</em><i class="gp" data-grip data-i="${i}" title="اسحب لإعادة الترتيب"></i></div>`).join('')||'<div class="emp">لا توجد نتائج</div>')}
function edP(p){return`<div class="eh"><h2>تعديل المنتج</h2><button class="btn dg" data-a="delP">حذف المنتج</button></div>
 <section class="sec"><h3>البيانات الأساسية</h3><div class="f">
  <div><label>الفئة <small>(للتصفية في الموقع)</small></label><select data-f="cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${p.cat==k?'selected':''}>${v}</option>`).join('')}</select></div>
  <div><label>الحجم على البطاقة <small>(مثال: 5 لتر)</small></label><input data-f="tag" value="${E(p.tag)}"></div>
  <div class="s3"><label>وصف قصير أسفل الاسم</label><input data-f="desc" value="${E(p.desc)}"></div></div></section>
 <section class="sec"><h3>صورة المنتج</h3><div class="imgrow">${drop(p.img,-1)}
  <div class="ihint"><p>ارفع صورة PNG بخلفية شفافة. تُضاف صورة الكراتين خلف المنتج تلقائيًا.</p><label class="ck"><input type="checkbox" data-f="cls" ${p.cls?'checked':''}> زجاجة رفيعة</label></div></div></section>
 <section class="sec"><h3><span>الأصناف <small>(اللون / الرائحة) · ${p.variants.length}</small></span><button class="btn sol" data-a="addV">+ صنف</button></h3>
 ${p.variants.map((v,j)=>`<div class="vr"><div class="vh"><span>صنف ${j+1}</span>${p.variants.length>1?`<button class="btn dg" data-a="rmV" data-j="${j}">حذف</button>`:''}</div>
  <div class="f c3">
   <div><label>الاسم المعروض</label><input data-v="label" data-j="${j}" value="${E(v.label)}"></div>
